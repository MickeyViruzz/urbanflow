databases:
  - name: urbanflow-db
    databaseName: urbanflow
    user: urbanflow
    plan: free
    region: singapore

services:
  - type: web
    name: urbanflow-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: urbanflow-db
          property: connectionString
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: urbanflow-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DEMO_AUTOSEED
        value: "true"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: HTTP_USER_AGENT
        value: UrbanFlowAcademicProject/1.0 (student project; +https://github.com/MickeyViruzz/urbanflow)

  - type: web
    name: urbanflow-web
    runtime: static
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: urbanflow-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
